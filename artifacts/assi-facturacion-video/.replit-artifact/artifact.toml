kind = "video"
videoAspectRatio = "16:9"
previewPath = "/assi-facturacion-video/"
title = "Facturación ASSI — Video"
description = "Video animado de presentación de la aplicación de facturación del equipo ASSI, para especialistas y administradores, con exportación compatible con Versat."
version = "1.0.0"
id = "artifacts/assi-facturacion-video"
router = "path"

[[services]]
name = "web"
paths = [ "/assi-facturacion-video/" ]
localPort = 24618

[services.development]
run = "pnpm --filter @workspace/assi-facturacion-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/assi-facturacion-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/assi-facturacion-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24618"
BASE_PATH = "/assi-facturacion-video/"
