openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Billing workspace data
  - name: customers
    description: Customer records
  - name: invoices
    description: Invoices and sharing
  - name: team
    description: Current user and team access
paths:
  /billing/series:
    get:
      operationId: listInvoiceSeries
      responses:
        "200":
          description: Series declaradas por el propietario; lectura para miembros activos.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InvoiceSeries" } }
    post:
      operationId: createInvoiceSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSeriesInput" }
      responses:
        "201":
          description: Serie confirmada por propietario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSeries" }
  /billing/series/{id}:
    patch:
      operationId: updateInvoiceSeries
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSeriesUpdate" }
      responses:
        "200":
          description: Serie actualizada sin retroceder el contador.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSeries" }
  /settlements:
    get:
      operationId: getMonthlySettlement
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        "200":
          description: Cálculo mensual por especialista, con alcance por propietario o especialista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlySettlement" }
  /settlements/classifications:
    post:
      operationId: createSettlementClassification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementClassificationInput" }
      responses:
        "201":
          description: Clasificación de licencia o servicio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementClassification" }
  /settlements/expenses:
    post:
      operationId: createSettlementExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementExpenseInput" }
      responses:
        "201":
          description: Gasto mensual asociado al especialista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementExpense" }
  /settlements/expenses/{id}/void:
    post:
      operationId: voidSettlementExpense
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementVoidInput" }
      responses:
        "200":
          description: Gasto anulado conservando el historial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementExpense" }
  /settlements/inclusions:
    post:
      operationId: createSettlementInvoiceInclusion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementInvoiceInclusionInput" }
      responses:
        "201":
          description: Excepción autorizada para incluir una factura no cobrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementInvoiceInclusion" }
  /settlements/inclusions/{id}/revoke:
    post:
      operationId: revokeSettlementInvoiceInclusion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementVoidInput" }
      responses:
        "200":
          description: Excepción revocada conservando el historial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementInvoiceInclusion" }
  /settlements/exchange-rates:
    put:
      operationId: updateSettlementExchangeRate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementExchangeRateInput" }
      responses:
        "200":
          description: Tasa de conversión del período guardada por el propietario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementExchangeRate" }
  /settlements/payments:
    post:
      operationId: createSettlementPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementPaymentInput" }
      responses:
        "201":
          description: Transferencia registrada para una liquidación mensual revisada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementPayment" }
        "403":
          description: Solo el propietario puede registrar transferencias.
        "409":
          description: La liquidación cambió o ya no tiene saldo pendiente.
        "422":
          description: El cálculo tiene bloqueos o el importe excede el saldo pendiente.
  /settlements/closures:
    post:
      operationId: createSettlementClosure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementClosureInput" }
      responses:
        "201":
          description: Liquidación mensual aprobada y guardada con su desglose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementClosure" }
        "403":
          description: Solo el propietario puede aprobar y cerrar.
        "409":
          description: La liquidación ya está cerrada.
        "422":
          description: El cálculo todavía tiene bloqueos.
  /settlements/closures/{id}/corrections:
    post:
      operationId: correctSettlementClosure
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementClosureCorrectionInput" }
      responses:
        "201":
          description: Corrección auditada guardada como nueva versión sin borrar la anterior.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementClosure" }
        "403":
          description: Solo el propietario puede corregir una liquidación.
        "404":
          description: No se encontró el cierre.
        "409":
          description: El cierre ya no es la última versión o el cálculo tiene bloqueos.
  /issuer:
    get:
      operationId: getIssuer
      tags: [billing]
      responses:
        "200":
          description: Configuración del emisor (solo propietario)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerSettings" }
    put:
      operationId: updateIssuer
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuerProfile" }
      responses:
        "200":
          description: Configuración guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerSettings" }
  /invoices/{id}/legal-document:
    put:
      operationId: authorizeInvoiceDocument
      tags: [billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentAuthorization" }
      responses:
        "200":
          description: Modelo confirmado por el propietario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}/images/{kind}:
    get:
      operationId: getInvoiceImage
      tags: [billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [stamp, signature] } }
      responses:
        "200":
          description: Imagen autorizada; requiere sesión del equipo o enlace vigente de esta factura
          content:
            image/png:
              schema: { type: string, format: binary }
  /shared-invoices/{token}/images/{kind}:
    get:
      operationId: getSharedInvoiceImage
      tags: [billing]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [stamp, signature] } }
      responses:
        "200":
          description: Imagen accesible solo con enlace vigente
          content:
            image/png:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/overview:
    get:
      operationId: getBillingOverview
      tags: [billing]
      summary: Get invoice dashboard summary
      responses:
        "200":
          description: Dashboard totals and recent invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOverview"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { description: Customer not found }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Archive a customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Customer archived }
        "404": { description: Customer not found }
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, finished, accepted, confirmed, voided, cancelled, error, sent, paid]
        - in: query
          name: paymentStatus
          schema: { type: string, enum: [pending, partial, paid] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice with line items
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Invoice not found }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update a draft invoice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Invoice not found }
  /invoices/{id}/status:
    patch:
      operationId: updateInvoiceStatus
      tags: [invoices]
      summary: Update invoice status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceStatusInput" }
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}/payments:
    post:
      operationId: createInvoicePayment
      tags: [invoices]
      summary: Administrator records a partial or full invoice payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentInput" }
      responses:
        "200":
          description: A previous request with this idempotency key; no second payment was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentResponse" }
        "201":
          description: Payment recorded and invoice balance recalculated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentResponse" }
        "403":
          description: Only the administrator may record payment
        "404":
          description: Invoice not found
        "409":
          description: Payment cannot be recorded in this lifecycle state
        "422":
          description: Invalid payment amount or payment date, or amount exceeds the outstanding balance
  /invoices/{id}/payment-corrections:
    post:
      operationId: correctInvoicePayment
      tags: [invoices]
      summary: Administrator corrects one invoice payment without changing its original receipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionInput" }
      responses:
        "200":
          description: Idempotent retry of a prior correction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionResponse" }
        "201":
          description: Payment state corrected and audit event recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionResponse" }
        "400":
          description: Invalid correction request
        "403":
          description: Only the administrator may correct a payment
        "404":
          description: Invoice not found
        "409":
          description: Payment is no longer correctable or the correction conflicts with current state
  /invoices/{id}/payment-corrections/export:
    get:
      operationId: downloadInvoicePaymentCorrections
      tags: [invoices]
      summary: Download the payment correction history for one invoice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: CSV file containing only this invoice's payment correction events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionsDownload" }
        "403":
          description: Only the administrator may export payment corrections
        "404":
          description: Invoice not found
  /invoices/{id}/share:
    post:
      operationId: createInvoiceShare
      tags: [invoices]
      summary: Create a public invoice link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceShare" }
  /invoices/{id}/payments/{paymentId}/share:
    post:
      operationId: createInvoiceReceiptShare
      tags: [invoices]
      summary: Create a public link limited to one payment receipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: paymentId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Receipt-only share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceShare" }
        "404": { description: Invoice or active payment not found }
  /invoices/{id}/shares:
    get:
      operationId: listInvoiceShares
      tags: [invoices]
      summary: List active links without exposing tokens or hashes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Active links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvoiceShareInfo" }
        "404": { description: Invoice unavailable }
  /invoices/{id}/image-accesses:
    get:
      operationId: listInvoiceImageAccesses
      tags: [invoices]
      summary: List public legal image openings (owner only; no tokens or visitor identity)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Public image opening history for the invoice
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvoiceImageAccess" }
        "403": { description: Owner access required }
        "404": { description: Invoice unavailable }
  /invoices/{id}/shares/{shareId}:
    delete:
      operationId: revokeInvoiceShare
      tags: [invoices]
      summary: Revoke only this link, preserving the invoice and share history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: shareId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Revoked (also succeeds if already revoked) }
        "404": { description: Invoice or link unavailable }
  /shared-invoices/{token}:
    get:
      operationId: getSharedInvoice
      tags: [invoices]
      summary: View an invoice using a private share token
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shared invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedInvoice" }
        "404": { description: Link not found or expired }
  /shared-invoices/{token}/receipts/{paymentId}:
    get:
      operationId: getSharedInvoiceReceipt
      tags: [invoices]
      summary: View one payment receipt using a private share token
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
        - in: path
          name: paymentId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Minimal details for the selected shared payment receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedInvoiceReceipt" }
        "404": { description: Link or payment not found or expired }
  /versat/catalogs:
    get:
      operationId: getVersatCatalogs
      tags: [Billing]
      responses:
        "200":
          description: Imported Versat catalogs, accessible to authorized team members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatCatalogs" }
    post:
      operationId: createVersatCatalogEntry
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersatCatalogInput" }
      responses:
        "201":
          description: Catalog entry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatCatalogEntry" }
        "409": { description: A catalog entry with this source ID or code already exists }
  /versat/catalogs/compare:
    post:
      operationId: compareVersatCatalogs
      tags: [Billing]
      summary: Compare active catalog entries with an administrator-provided Versat CSV
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersatCatalogFileInput" }
      responses:
        "200":
          description: Read-only catalog comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatCatalogComparison" }
        "400": { description: Invalid or unsupported CSV file }
  /versat/catalogs/{id}/history:
    get:
      operationId: getVersatCatalogHistory
      tags: [Billing]
      summary: Read the immutable change history for a Versat catalog entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Catalog entry history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VersatCatalogAuditEvent" }
        "404": { description: Catalog entry not found }
  /versat/catalogs/{id}:
    patch:
      operationId: updateVersatCatalogEntry
      tags: [Billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersatCatalogUpdate" }
      responses:
        "200":
          description: Catalog entry updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatCatalogEntry" }
        "404": { description: Catalog entry not found }
        "409": { description: A catalog entry with this code already exists }
  /invoices/{id}/versat-file:
    post:
      operationId: downloadInvoiceVersatFile
      tags: [Billing]
      summary: Compare catalogs, then download a valid Versat invoice file and record acceptance
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersatCatalogFileInput" }
      responses:
        "200":
          description: Candidate Fac file; successful generation marks the invoice accepted in this app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatDownload" }
        "422":
          description: Catalog mismatch or missing/unsupported Versat fields
  /versat/export-file:
    post:
      operationId: downloadVersatExportFile
      tags: [Billing]
      summary: Compare catalogs, then download a Versat batch and record acceptance
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: encoding, in: query, schema: { type: string, enum: [windows-1252, utf-8], default: windows-1252 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersatCatalogFileInput" }
      responses:
        "200":
          description: ZIP with one candidate Fac per invoice; successful generation marks included invoices accepted in this app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatDownload" }
        "422":
          description: Catalog mismatch, no invoices, or incomplete mappings; no partial download
  /versat/export:
    get:
      operationId: exportVersatInvoices
      tags: [invoices]
      summary: Export invoices for Versat import
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Export rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvoiceExportRow" }
  /team/me:
    get:
      operationId: getCurrentTeamMember
      tags: [team]
      summary: Get current user's application access, including suspension (no business data)
      responses:
        "200":
          description: Current team member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "403": { description: Access has not been granted }
  /team/members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List team access
      responses:
        "200":
          description: Team members and pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
  /team/invitations:
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Grant a specialist access by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInvitationInput" }
      responses:
        "201":
          description: Access invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInvitation" }
  /team/members/{userId}/access:
    patch:
      operationId: updateTeamMemberAccess
      tags: [team]
      summary: Owner-only suspension or reactivation; preserves invoices and commercial assignment
      description: Suspensions override roles and invitations. Owners cannot be suspended. Public invoice links are managed separately. Invitation rows use their invite-prefixed userId.
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberAccessInput" }
      responses:
        "204": { description: Access state saved }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Owner access required or suspended }
        "404": { description: Team member not found }
        "422": { description: Owner account cannot be suspended }
