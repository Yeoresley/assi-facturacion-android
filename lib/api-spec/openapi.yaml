openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Billing workspace data
  - name: customers
    description: Customer records
  - name: invoices
    description: Invoices and sharing
  - name: team
    description: Current user and team access
paths:
  /billing/series:
    get:
      operationId: listInvoiceSeries
      responses:
        "200":
          description: Series declaradas por el propietario; lectura para miembros activos.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InvoiceSeries" } }
    post:
      operationId: createInvoiceSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSeriesInput" }
      responses:
        "200":
          description: A previous request with this idempotency key; no second payment was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentResponse" }
        "201":
          description: Serie confirmada por propietario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSeries" }
  /billing/series/{id}:
    patch:
      operationId: updateInvoiceSeries
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSeriesUpdate" }
      responses:
        "200":
          description: Serie actualizada sin retroceder el contador.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSeries" }
  /issuer:
    get:
      operationId: getIssuer
      tags: [billing]
      responses:
        "200":
          description: Configuración del emisor (solo propietario)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerSettings" }
    put:
      operationId: updateIssuer
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuerProfile" }
      responses:
        "200":
          description: Configuración guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerSettings" }
  /invoices/{id}/legal-document:
    put:
      operationId: authorizeInvoiceDocument
      tags: [billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentAuthorization" }
      responses:
        "200":
          description: Modelo confirmado por el propietario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}/images/{kind}:
    get:
      operationId: getInvoiceImage
      tags: [billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [stamp, signature] } }
      responses:
        "200":
          description: Imagen autorizada; requiere sesión del equipo o enlace vigente de esta factura
          content:
            image/png:
              schema: { type: string, format: binary }
  /shared-invoices/{token}/images/{kind}:
    get:
      operationId: getSharedInvoiceImage
      tags: [billing]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [stamp, signature] } }
      responses:
        "200":
          description: Imagen accesible solo con enlace vigente
          content:
            image/png:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/overview:
    get:
      operationId: getBillingOverview
      tags: [billing]
      summary: Get invoice dashboard summary
      responses:
        "200":
          description: Dashboard totals and recent invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOverview"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { description: Customer not found }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Archive a customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Customer archived }
        "404": { description: Customer not found }
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, finished, accepted, confirmed, voided, cancelled, error, sent, paid]
        - in: query
          name: paymentStatus
          schema: { type: string, enum: [pending, paid] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice with line items
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Invoice not found }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update a draft invoice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Invoice not found }
  /invoices/{id}/status:
    patch:
      operationId: updateInvoiceStatus
      tags: [invoices]
      summary: Update invoice status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceStatusInput" }
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}/payments:
    post:
      operationId: createInvoicePayment
      tags: [invoices]
      summary: Administrator records a partial or full invoice payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentInput" }
      responses:
        "200":
          description: A previous request with this idempotency key; no second payment was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentResponse" }
        "201":
          description: Payment recorded and invoice balance recalculated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentResponse" }
        "403":
          description: Only the administrator may record payment
        "404":
          description: Invoice not found
        "409":
          description: Payment cannot be recorded in this lifecycle state
        "422":
          description: Invalid payment amount or payment date, or amount exceeds the outstanding balance
  /invoices/{id}/payment-corrections:
    post:
      operationId: correctInvoicePayment
      tags: [invoices]
      summary: Administrator reverses an erroneous full-payment mark without deleting its evidence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionInput" }
      responses:
        "200":
          description: Idempotent retry of a prior correction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionResponse" }
        "201":
          description: Payment state corrected and audit event recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentCorrectionResponse" }
        "400":
          description: Invalid correction request
        "403":
          description: Only the administrator may correct a payment
        "404":
          description: Invoice not found
        "409":
          description: Invoice is not currently fully paid or the correction conflicts with current state
  /invoices/{id}/share:
    post:
      operationId: createInvoiceShare
      tags: [invoices]
      summary: Create a public invoice link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceShare" }
  /invoices/{id}/shares:
    get:
      operationId: listInvoiceShares
      tags: [invoices]
      summary: List active links without exposing tokens or hashes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Active links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvoiceShareInfo" }
        "404": { description: Invoice unavailable }
  /invoices/{id}/shares/{shareId}:
    delete:
      operationId: revokeInvoiceShare
      tags: [invoices]
      summary: Revoke only this link, preserving the invoice and share history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: shareId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Revoked (also succeeds if already revoked) }
        "404": { description: Invoice or link unavailable }
  /shared-invoices/{token}:
    get:
      operationId: getSharedInvoice
      tags: [invoices]
      summary: View an invoice using a private share token
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shared invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Link not found or expired }
  /versat/catalogs:
    get:
      operationId: getVersatCatalogs
      tags: [Billing]
      responses:
        "200":
          description: Imported Versat catalogs, accessible to authorized team members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatCatalogs" }
  /invoices/{id}/versat-file:
    get:
      operationId: getInvoiceVersatFile
      tags: [Billing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Candidate Fac file, not yet certified by a real Versat import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatDownload" }
        "422":
          description: Missing or unsupported Versat fields
  /versat/export-file:
    get:
      operationId: getVersatExportFile
      tags: [Billing]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: encoding, in: query, schema: { type: string, enum: [windows-1252, utf-8], default: windows-1252 } }
      responses:
        "200":
          description: ZIP with one candidate Fac per issued invoice and instructions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersatDownload" }
        "422":
          description: No invoices or incomplete mappings; no partial download
  /versat/export:
    get:
      operationId: exportVersatInvoices
      tags: [invoices]
      summary: Export invoices for Versat import
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Export rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvoiceExportRow" }
  /team/me:
    get:
      operationId: getCurrentTeamMember
      tags: [team]
      summary: Get current user's application access, including suspension (no business data)
      responses:
        "200":
          description: Current team member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "403": { description: Access has not been granted }
  /team/members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List team access
      responses:
        "200":
          description: Team members and pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
  /team/invitations:
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Grant a specialist access by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInvitationInput" }
      responses:
        "201":
          description: Access invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInvitation" }
  /team/members/{userId}/access:
    patch:
      operationId: updateTeamMemberAccess
      tags: [team]
      summary: Owner-only suspension or reactivation; preserves invoices and commercial assignment
      description: Suspensions override roles and invitations. Owners cannot be suspended. Public invoice links are managed separately. Invitation rows use their invite-prefixed userId.
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberAccessInput" }
      responses:
        "204": { description: Access state saved }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Owner access required or suspended }
        "404": { description: Team member not found }
        "422": { description: Owner account cannot be suspended }
components:
  schemas:
    TeamMemberAccessInput:
      type: object
      required: [suspended]
      properties:
        suspended: { type: boolean }
    InvoiceSeriesInput:
      type: object
      required: [name, prefix, suffix, width, talon, nextNumber, confirmedWithVersat]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        prefix: { type: string, pattern: '^[A-Za-z0-9_-]*$', maxLength: 20 }
        suffix: { type: string, pattern: '^[A-Za-z0-9_-]*$', maxLength: 10 }
        width: { type: integer, minimum: 1, maximum: 10 }
        talon: { type: string, pattern: '^[0-9]+$', maxLength: 20 }
        nextNumber: { type: integer, minimum: 0, maximum: 2147483646 }
        confirmedWithVersat: { type: boolean, enum: [true] }
    InvoiceSeriesUpdate:
      type: object
      required: [active, nextNumber, confirmedWithVersat]
      properties:
        active: { type: boolean }
        nextNumber: { type: integer, minimum: 0, maximum: 2147483647 }
        confirmedWithVersat: { type: boolean, enum: [true] }
    InvoiceSeries:
      type: object
      required: [id, name, prefix, suffix, width, talon, nextNumber, active]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        suffix: { type: string }
        width: { type: integer }
        talon: { type: string }
        nextNumber: { type: integer }
        active: { type: boolean }
    IssuerProfile:
      type: object
      required: [name, nit, ircc, address, organization, paymentBeneficiary, bankAccount, bankBranch, bankName]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        nit: { type: string, minLength: 1, maxLength: 40 }
        ircc: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 400 }
        organization: { type: string, minLength: 1, maxLength: 100 }
        paymentBeneficiary: { type: string, minLength: 1, maxLength: 200 }
        bankAccount: { type: string, minLength: 1, maxLength: 80 }
        bankBranch: { type: string, minLength: 1, maxLength: 80 }
        bankName: { type: string, minLength: 1, maxLength: 200 }
    IssuerSettings:
      type: object
      required: [profile, hasStamp, hasSignature]
      properties:
        profile:
          anyOf:
            - { $ref: "#/components/schemas/IssuerProfile" }
            - { type: "null" }
        hasStamp: { type: boolean }
        hasSignature: { type: boolean }
    DocumentAuthorization:
      type: object
      required: [preparedBy, preparedPosition, deliveredBy, accountedBy, transportedBy, transportId, vehiclePlate, drivingLicense, receivedBy, receivedPosition, receivedId, customerIrcc, customerBankAccount, useStamp, useSignature, confirm]
      properties:
        preparedBy: { type: string, minLength: 1, maxLength: 160 }
        preparedPosition: { type: string, minLength: 1, maxLength: 160 }
        deliveredBy: { type: string, maxLength: 160 }
        accountedBy: { type: string, maxLength: 160 }
        transportedBy: { type: string, maxLength: 160 }
        transportId: { type: string, maxLength: 40 }
        vehiclePlate: { type: string, maxLength: 40 }
        drivingLicense: { type: string, maxLength: 40 }
        receivedBy: { type: string, maxLength: 160 }
        receivedPosition: { type: string, maxLength: 160 }
        receivedId: { type: string, maxLength: 40 }
        customerIrcc: { type: string, maxLength: 80 }
        customerBankAccount: { type: string, maxLength: 80 }
        useStamp: { type: boolean }
        useSignature: { type: boolean }
        confirm: { type: boolean, enum: [true] }
    LegalDocument:
      allOf:
        - { $ref: "#/components/schemas/DocumentAuthorization" }
        - type: object
          required: [issuer, stampPath, signaturePath, authorizedAt]
          properties:
            issuer: { $ref: "#/components/schemas/IssuerProfile" }
            stampPath: { type: ["string", "null"] }
            signaturePath: { type: ["string", "null"] }
            authorizedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Customer:
      type: object
      required: [id, name, email, phone, taxId, address, notes, active, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        versatCode: { type: ["string", "null"] }
        versatSourceId: { type: ["integer", "null"] }
        ircc: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        taxId: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        versatCode: { type: ["string", "null"], maxLength: 40 }
        ircc: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        taxId: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    InvoiceLine:
      type: object
      required: [id, description, quantity, unitPrice, amount]
      properties:
        id: { type: integer }
        description: { type: string }
        serviceId: { type: ["integer", "null"] }
        serviceCode: { type: ["string", "null"] }
        groupCode: { type: ["string", "null"] }
        unitCode: { type: ["string", "null"] }
        quantity: { type: number }
        unitPrice: { type: number }
        amount: { type: number }
    InvoiceLineInput:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        description: { type: string, minLength: 1 }
        serviceId: { type: ["integer", "null"] }
        groupCode: { type: ["string", "null"], pattern: '^[A-Za-z0-9.-]*$', maxLength: 40 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 999999999 }
        unitPrice: { type: number, minimum: 0, maximum: 999999999999 }
    Invoice:
      type: object
      required: [id, number, customerId, customerName, specialistId, specialistName, issueDate, dueDate, currency, status, paymentStatus, totalPaid, balanceDue, payments, paidAt, notes, subtotal, total, lines, createdAt]
      properties:
        seriesId: { type: ["integer", "null"] }
        id: { type: integer }
        number: { type: string }
        customerId: { type: integer }
        customerName: { type: string }
        specialistId: { type: string }
        specialistName: { type: string }
        issueDate: { type: string, format: date }
        dueDate: { type: ["string", "null"], format: date }
        currency: { type: string }
        status: { type: string, enum: [draft, finished, accepted, confirmed, voided, cancelled, error, sent, paid] }
        statusCode: { type: ["integer", "null"], minimum: 1, maximum: 7 }
        paymentStatus: { type: string, enum: [pending, paid] }
        totalPaid: { type: number, minimum: 0 }
        balanceDue: { type: number, minimum: 0 }
        payments:
          type: array
          items: { $ref: "#/components/schemas/InvoicePayment" }
        paymentCorrections:
          type: array
          items: { $ref: "#/components/schemas/InvoicePaymentCorrection" }
        paidAt: { type: ["string", "null"], format: date-time }
        acceptedAt: { type: ["string", "null"], format: date-time }
        confirmedAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        versat:
          anyOf:
            - { $ref: "#/components/schemas/VersatInvoiceSnapshot" }
            - { type: "null" }
        legalDocument:
          anyOf:
            - { $ref: "#/components/schemas/LegalDocument" }
            - { type: "null" }
        subtotal: { type: number }
        total: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        createdAt: { type: string, format: date-time }
    InvoiceInput:
      type: object
      required: [customerId, issueDate, currency, lines]
      properties:
        seriesId: { type: ["integer", "null"], minimum: 1 }
        customerId: { type: integer }
        issueDate: { type: string, format: date }
        dueDate: { type: ["string", "null"], format: date }
        currency: { type: string, minLength: 1 }
        notes: { type: ["string", "null"] }
        versat: { $ref: "#/components/schemas/VersatInvoiceInput" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InvoiceLineInput" }
    InvoicePaymentInput:
      type: object
      required: [amount, paidOn, idempotencyKey]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999999.99, multipleOf: 0.01 }
        paidOn: { type: string, format: date }
        idempotencyKey: { type: string, format: uuid }
    InvoicePaymentCorrectionInput:
      type: object
      required: [reason, idempotencyKey, confirmed]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000 }
        idempotencyKey: { type: string, format: uuid }
        confirmed: { type: boolean, enum: [true] }
    InvoicePayment:
      type: object
      required: [id, amount, currency, paidOn, recordedAt]
      properties:
        id: { type: integer }
        amount: { type: number }
        currency: { type: string }
        paidOn: { type: string, format: date }
        recordedAt: { type: string, format: date-time }
    InvoicePaymentCorrection:
      type: object
      required: [id, reason, correctedBy, createdAt, reversedPaymentId, beforeInvoiceStatus, afterInvoiceStatus, beforePaymentStatus, afterPaymentStatus, beforeTotalPaid, afterTotalPaid, originalPaidBy, originalPaidAt]
      properties:
        id: { type: integer }
        reason: { type: string }
        correctedBy: { type: string }
        createdAt: { type: string, format: date-time }
        reversedPaymentId: { type: ["integer", "null"] }
        beforeInvoiceStatus: { type: string }
        afterInvoiceStatus: { type: string }
        beforePaymentStatus: { type: string, enum: [pending, paid] }
        afterPaymentStatus: { type: string, enum: [pending, paid] }
        beforeTotalPaid: { type: number }
        afterTotalPaid: { type: number }
        originalPaidBy: { type: ["string", "null"] }
        originalPaidAt: { type: ["string", "null"], format: date-time }
    InvoicePaymentResponse:
      type: object
      required: [invoiceId, paymentStatus, totalPaid, balanceDue, payments]
      properties:
        invoiceId: { type: integer }
        paymentStatus: { type: string, enum: [pending, paid] }
        totalPaid: { type: number }
        balanceDue: { type: number }
        payments:
          type: array
          items: { $ref: "#/components/schemas/InvoicePayment" }
    InvoicePaymentCorrectionResponse:
      type: object
      required: [invoiceId, paymentStatus, totalPaid, balanceDue, payments, paymentCorrections]
      properties:
        invoiceId: { type: integer }
        paymentStatus: { type: string, enum: [pending, paid] }
        totalPaid: { type: number }
        balanceDue: { type: number }
        payments:
          type: array
          items: { $ref: "#/components/schemas/InvoicePayment" }
        paymentCorrections:
          type: array
          items: { $ref: "#/components/schemas/InvoicePaymentCorrection" }
    InvoiceStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [draft, finished, accepted, confirmed, voided, cancelled, error] }
    InvoiceShare:
      type: object
      required: [id, url, expiresAt]
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    InvoiceShareInfo:
      type: object
      required: [id, createdAt, expiresAt]
      properties:
        id: { type: integer }
        createdAt: { type: ["string", "null"], format: date-time, description: Unknown for legacy links }
        expiresAt: { type: string, format: date-time }
    InvoiceExportRow:
      type: object
      required: [invoiceNumber, issueDate, customerName, taxId, currency, subtotal, total, status]
      properties:
        id: { type: integer }
        versatNumber: { type: ["string", "null"] }
        canExport: { type: boolean }
        issues: { type: array, items: { type: string } }
        invoiceNumber: { type: string }
        issueDate: { type: string, format: date }
        customerName: { type: string }
        taxId: { type: ["string", "null"] }
        currency: { type: string }
        subtotal: { type: number }
        total: { type: number }
        status: { type: string }
    BillingOverview:
      type: object
      required: [invoiceCount, draftCount, sentCount, paidCount, finishedCount, acceptedCount, confirmedCount, monthTotal, currency, recentInvoices]
      properties:
        invoiceCount: { type: integer }
        draftCount: { type: integer }
        sentCount: { type: integer }
        paidCount: { type: integer }
        finishedCount: { type: integer }
        acceptedCount: { type: integer }
        confirmedCount: { type: integer }
        monthTotal: { type: number }
        currency: { type: string }
        recentInvoices:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
    TeamMember:
      type: object
      required: [userId, name, email, role, commercialId, suspended]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        role: { type: string, enum: [owner, specialist, pending] }
        commercialId: { type: ["integer", "null"] }
        suspended: { type: boolean }
    TeamInvitationInput:
      type: object
      required: [email, commercialId]
      properties:
        email: { type: string, format: email }
        commercialId: { type: ["integer", "null"], minimum: 1 }
    TeamInvitation:
      type: object
      required: [email, createdAt, commercialId]
      properties:
        email: { type: string, format: email }
        commercialId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    VersatCatalogEntry:
      type: object
      required: [id, kind, sourceId, code, name, unitCode, unitName, groupCode, position]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [service, unit, currency, concept, operation, commercial, payment] }
        sourceId: { type: integer }
        code: { type: string }
        name: { type: string }
        unitCode: { type: ["string", "null"] }
        unitName: { type: ["string", "null"] }
        groupCode: { type: ["string", "null"] }
        position: { type: ["string", "null"] }
    VersatCatalogs:
      type: object
      required: [entries, customerCount]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/VersatCatalogEntry" } }
        customerCount: { type: integer }
    VersatInvoiceInput:
      type: object
      required: [conceptId, operationId, commercialId, paymentId]
      properties:
        conceptId: { type: integer }
        operationId: { type: integer }
        commercialId: { type: integer }
        paymentId: { type: integer }
        number: { type: ["string", "null"], pattern: '^[A-Za-z0-9_-]*$', maxLength: 50 }
        talon: { type: ["string", "null"], pattern: '^[0-9]*$', maxLength: 20 }
        bankAccountMC: { type: ["string", "null"], maxLength: 100 }
        bankAccountOM: { type: ["string", "null"], maxLength: 100 }
        contract: { type: ["string", "null"], maxLength: 100 }
    VersatInvoiceSnapshot:
      allOf:
        - { $ref: "#/components/schemas/VersatInvoiceInput" }
        - type: object
          required: [currencyName, conceptCode, operationName, commercialName, commercialPosition, paymentName, customerCode, customerName, customerAddress, customerTaxId]
          properties:
            currencyName: { type: string }
            conceptCode: { type: string }
            operationName: { type: string }
            commercialName: { type: string }
            commercialPosition: { type: string }
            paymentName: { type: string }
            customerCode: { type: ["string", "null"] }
            customerName: { type: string }
            customerAddress: { type: ["string", "null"] }
            customerTaxId: { type: ["string", "null"] }
    VersatDownload:
      type: object
      required: [filename, base64, contentType, invoiceCount, warnings]
      properties:
        filename: { type: string }
        base64: { type: string }
        contentType: { type: string }
        invoiceCount: { type: integer }
        warnings: { type: array, items: { type: string } }
